name: VersoCustom
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
options:
  bundleIdPrefix: com.akki
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  VersoCustom:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared/LyricRules
        excludes:
          - Fixtures.json
          - UPSTREAM
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lunalyr
        CFBundleName: Lunalyr
        CFBundleShortVersionString: 2.0.0
        CFBundleVersion: "22"
        LSUIElement: true
        NSHumanReadableCopyright: © 2026
        NSAppleEventsUsageDescription: Lunalyr reads the playing song and its position from Music, Spotify, VLC, Swinsian, VOX or a web player in your browser to show its lyrics, and controls playback only when you use its buttons. Enabled lyric services receive song metadata.
        NSAudioCaptureUsageDescription: Optional live wallpaper response analyses system output locally. No audio is recorded or uploaded.
        SUFeedURL: "https://github.com/WaterBotol/Lunalyr/releases/latest/download/appcast.xml"
        SUPublicEDKey: "7jKIfrh09CHJcYReGfz14ICbU1+cqaveBRzn16fCwpY="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
        SUVerifyUpdateBeforeExtraction: true
        # Without this key a dual-GPU Intel MacBook Pro switches to the
        # discrete GPU for as long as Lunalyr runs. The key only helps while
        # no Metal code asks for the system default device: that is the
        # discrete GPU, powered up for as long as the device is held. Every
        # renderer (visualisers and GPU effects alike) takes the GPU driving
        # its display from VisualizerGPU instead, and the artwork palette's
        # Core Image context is allowed the low-power GPU.
        NSSupportsAutomaticGraphicsSwitching: true
        # lunalyr://join/<room>, toggle, card, settings (LunalyrLinks.swift).
        CFBundleURLTypes:
          - CFBundleURLName: local.verso.custom.link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - lunalyr
    dependencies:
      - package: Yams
        product: Yams
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.verso.custom
        PRODUCT_NAME: Lunalyr
        PRODUCT_MODULE_NAME: VersoCustom
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/VersoCustom-Bridging-Header.h"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Debug:
          # Debug runs, including the unit-test host, get their own
          # preferences domain, caches and privacy grants, so they never read
          # or rewrite the installed app's settings. Release keeps
          # local.verso.custom, which existing installs and updates rely on.
          PRODUCT_BUNDLE_IDENTIFIER: local.verso.custom.debug

  VersoCustomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Swift
    dependencies:
      - target: VersoCustom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.verso.custom.tests
        GENERATE_INFOPLIST_FILE: YES
        # Created before any test runs; it moves home-relative folders
        # (Application Support, Caches) into a throwaway directory.
        INFOPLIST_KEY_NSPrincipalClass: LunalyrTestEnvironment
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/VersoCustom-Bridging-Header.h"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lunalyr.app/Contents/MacOS/Lunalyr"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
schemes:
  VersoCustom:
    build:
      targets:
        VersoCustom: all
    test:
      targets:
        - VersoCustomTests
