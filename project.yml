name: VersoCustom
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
options:
  bundleIdPrefix: com.akki
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  VersoCustom:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lunalyr
        CFBundleName: Lunalyr
        CFBundleShortVersionString: 0.4.7
        CFBundleVersion: "14"
        LSUIElement: true
        NSHumanReadableCopyright: © 2026
        NSAppleEventsUsageDescription: Lunalyr reads song information and playback position from Music to display lyrics. Enabled lyric services receive song metadata.
        NSAudioCaptureUsageDescription: Optional live wallpaper response analyses system output locally. No audio is recorded or uploaded.
        SUFeedURL: "https://github.com/WaterBotol/Lunalyr/releases/latest/download/appcast.xml"
        SUPublicEDKey: "7jKIfrh09CHJcYReGfz14ICbU1+cqaveBRzn16fCwpY="
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
        SUVerifyUpdateBeforeExtraction: true
    dependencies:
      - package: Yams
        product: Yams
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.verso.custom
        PRODUCT_NAME: Lunalyr
        PRODUCT_MODULE_NAME: VersoCustom
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/VersoCustom-Bridging-Header.h"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  VersoCustomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Swift
    dependencies:
      - target: VersoCustom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.verso.custom.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/VersoCustom-Bridging-Header.h"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lunalyr.app/Contents/MacOS/Lunalyr"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
schemes:
  VersoCustom:
    build:
      targets:
        VersoCustom: all
    test:
      targets:
        - VersoCustomTests
