# Lunalyr listen-along relay. See README.md for deploy steps and PROTOCOL.md
# for the wire format.
name = "lunalyr-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One Durable Object per listening room. SQLite-backed classes are the kind
# available on the Workers Free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per-client limit on POST /rooms (5 a minute, per Cloudflare location). The
# Workers rate-limiting binding is free and needs no setup beyond this block;
# namespace_id only has to be unique within your Cloudflare account. Keep
# `limit` in step with ROOMS_PER_MINUTE in src/index.ts.
[[ratelimits]]
name = "ROOM_CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The worker does not log anything itself; this only keeps Cloudflare's own
# request log off so no room URLs are retained there either.
[observability]
enabled = false
