name: Publish preview release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-preview
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Xcode and XcodeGen versions are pinned in Scripts/ci.sh.
      - name: Select pinned Xcode
        run: bash Scripts/ci.sh select-xcode
      - name: Install build tools
        run: |
          bash Scripts/ci.sh install-xcodegen
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Swift package cache key
        id: packages
        run: bash Scripts/ci.sh package-cache-key
      - name: Restore resolved Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Build/TestDerivedData/SourcePackages
          key: ${{ steps.packages.outputs.key }}
          restore-keys: ${{ steps.packages.outputs.prefix }}
      # Previews are signed ad hoc. The code-signing certificate is reserved
      # for stable updates (the draft-release job in macos.yml), which run in
      # the protected "release" environment.
      #
      # As in macos.yml: the step limit stays under the job's so the
      # validation logs are still uploaded, and a runner without a Metal
      # device fails the GPU and WebKit tests instead of skipping them.
      - name: Test and build
        timeout-minutes: 30
        env:
          PUBLIC_UPDATE_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          LUNALYR_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/Build/TestDerivedData/SourcePackages
          TEST_RUNNER_LUNALYR_REQUIRE_GPU: '1'
        run: |
          if [[ -n "$PUBLIC_UPDATE_KEY" ]]; then
            python3 Scripts/configure-updates.py --github "$GITHUB_REPOSITORY" --public-key "$PUBLIC_UPDATE_KEY"
          fi
          python3 -m unittest discover -s Tests/Python -v
          bash Scripts/test.sh
          bash Scripts/build.sh
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-validation
          path: |
            Build/test.log
            Build/build.log
            Build/TestDerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Build/Lunalyr.app/Contents/Info.plist)"
          TAG="v$VERSION-preview"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This preview already exists. Bump the version before releasing again."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent Build/Lunalyr.app "Build/Lunalyr-$VERSION-Mac.zip"
          printf '%s\n' 'Early preview for macOS 14+. Extract the ZIP and open Lunalyr.app. Xcode is not needed to use the compiled app.' '' 'This app is locally signed; Developer ID notarisation is not configured. Live audio, animations and performance remain under development. The updater uses the stable channel. Preview releases are installed manually. See docs/RELEASING.md and docs/VALIDATION.md.' > Build/release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Lunalyr $VERSION preview" --notes-file Build/release-notes.md "Build/Lunalyr-$VERSION-Mac.zip"
